# Enforce notebook output hygiene to reduce student data exposure risk.
# This CI check is the server-side safety net and complements local nbstripout filtering.
# Policy references: AGENTS.md (Critical Rules) and results/AGENTS.md (Notebook Hygiene).
name: Notebook output check

on:
  push:
    paths: ['**/*.ipynb']
  pull_request:
    paths: ['**/*.ipynb']

jobs:
  check-notebook-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nbstripout
        run: pip install nbstripout

      - name: Check for cell outputs in notebooks
        run: |
          status=0
          for nb in $(find . -name '*.ipynb' -not -path './.ipynb_checkpoints/*'); do
            if nbstripout --verify "$nb" 2>/dev/null; then
              echo "✓ $nb — clean"
            else
              echo "✗ $nb — CONTAINS OUTPUTS (student data risk!)"
              status=1
            fi
          done
          if [ $status -ne 0 ]; then
            echo ""
            echo "::error::Notebooks with cell outputs detected (privacy risk). See results/AGENTS.md and README.md."
            echo "Quick fix: run 'nbstripout *.ipynb' before re-pushing."
            echo "Recommended setup: nbstripout --install --attributes .gitattributes"
            exit 1
          fi
