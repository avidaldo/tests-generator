[project]
name = "tests-generator"
version = "0.1.0"
description = "Moodle quiz generation, review and results analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.25.0",
    "jsonschema>=4.18",
]

[project.scripts]
qb = "qb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qb"]

[tool.pytest.ini_options]
testpaths = ["tests", "editor/tests"]

[dependency-groups]
dev = [
    "nbstripout>=0.7.0",
    "pytest>=9.2.0",
    "yapf>=0.40.0",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
indent_width = 4
split_before_named_assigns = false
